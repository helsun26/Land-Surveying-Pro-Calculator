<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculator — Land Surveying Pro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator" role="application" aria-label="Calculator">
    <header>
      <h1>Calculator</h1>
      <p class="subtitle">Safe expression parser • memory • trig &amp; power</p>
    </header>

    <input id="display" class="display" type="text" aria-label="Calculator display" readonly>

    <div class="keys">
      <button class="btn" data-action="clear">C</button>
      <button class="btn" data-action="back">⌫</button>
      <button class="btn" data-action="percent">%</button>
      <button class="btn operator" data-value="/">÷</button>

      <button class="btn" data-value="7">7</button>
      <button class="btn" data-value="8">8</button>
      <button class="btn" data-value="9">9</button>
      <button class="btn operator" data-value="*">×</button>

      <button class="btn" data-value="4">4</button>
      <button class="btn" data-value="5">5</button>
      <button class="btn" data-value="6">6</button>
      <button class="btn operator" data-value="-">−</button>

      <button class="btn" data-value="1">1</button>
      <button class="btn" data-value="2">2</button>
      <button class="btn" data-value="3">3</button>
      <button class="btn operator" data-value="+">+</button>

      <button class="btn zero" data-value="0">0</button>
      <button class="btn" data-value=".">.</button>
      <button class="btn equals" data-action="equals">=</button>

      <!-- Extra functions row -->
      <button class="btn fn" data-fn="sqrt">√</button>
      <button class="btn fn" data-fn="pow">^</button>
      <button class="btn fn" data-fn="sin">sin</button>
      <button class="btn fn" data-fn="cos">cos</button>

      <button class="btn mem" data-action="mc">MC</button>
      <button class="btn mem" data-action="mr">MR</button>
      <button class="btn mem" data-action="mplus">M+</button>
      <button class="btn mem" data-action="mminus">M-</button>
    </div>

    <footer>
      <small>Files: /calculator — Open index.html in a browser. Parser uses Shunting-yard + RPN evaluator (no eval).</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
